# Site settings
name: Zikun Wang
description: Zikun Wang's personal website.

# Contact / social links
email: wang.zikun@northeastern.edu
github: zikunw
linkedin: zikunw

# Your website URL (used for sitemap.xml and canonical links)
url: "https://zikunw.github.io"
# baseurl left empty: this is a user site served at the domain root
baseurl: ""

# Permalink for blog posts
permalink: /posts/:title/

# Jekyll 3 / GitHub Pages use Kramdown for Markdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Plugins
plugins:
  - jekyll-sitemap

# Exclude these files from the built site
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - package.json
  - package-lock.json
  - vendor
